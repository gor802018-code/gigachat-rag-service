[project]
name = "llm-rag"
version = "0.1.0"
description = "Production-ready Retrieval-Augmented Generation service: FastAPI + FAISS + GigaChat"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
keywords = ["rag", "fastapi", "faiss", "gigachat", "llm", "langchain"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 is incompatible with bcrypt>=4.1 (backend self-test)
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-gigachat>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "pypdf>=5.0",
    "docx2txt>=0.8",
    "httpx>=0.27",
    "streamlit>=1.39",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5.0"
ruff = ">=0.7"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",
    # Cyrillic letters that look like Latin ones are expected in a Russian-language project.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
